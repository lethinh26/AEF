name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aeo
          POSTGRES_USER: aeo
          POSTGRES_PASSWORD: aeo_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeo -d aeo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AEO_ENVIRONMENT: ci
      AEO_DATABASE_URL: postgresql+asyncpg://aeo:aeo_ci_password@127.0.0.1:5432/aeo
      AEO_TEST_DATABASE_URL: postgresql+asyncpg://aeo:aeo_ci_password@127.0.0.1:5432/aeo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Verify Python runtime alignment
        run: python scripts/check_python_runtime.py
      - name: Install Python workspace
        run: uv sync --all-packages --all-groups --locked
      - name: Lint Python
        run: uv run ruff check apps packages infra/migrations
      - name: Apply database migrations
        run: uv run alembic -c infra/migrations/alembic.ini upgrade head
      - name: Test Python
        run: uv run pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Node workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck:web
      - name: Lint
        run: pnpm lint:web
      - name: Build
        run: pnpm build:web

  container-build:
    name: container-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag aeo-api:ci .
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aeo-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Build worker image
        run: docker build --file apps/worker/Dockerfile --tag aeo-worker:ci .
      - name: Scan worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aeo-worker:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Build web image
        run: docker build --file apps/web/Dockerfile --tag aeo-web:ci .
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aeo-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Validate application Compose configuration
        run: docker compose -f compose.yaml -f compose.application.yaml config --quiet

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
