name: aeo-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aeo}
      POSTGRES_USER: ${POSTGRES_USER:-aeo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeo_local_only_change_me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  object-store:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aeo-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aeo_local_object_store_change_me}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object_store_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  object-store-init:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    depends_on:
      object-store:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mcli alias set local http://object-store:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        mcli mb --ignore-existing local/aeo-artifacts;
        mcli anonymous set none local/aeo-artifacts;
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aeo-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aeo_local_object_store_change_me}
    restart: "no"

volumes:
  postgres_data:
  object_store_data:
