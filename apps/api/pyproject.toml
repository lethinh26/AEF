[project]
name = "aeo-api"
version = "0.1.0"
description = "AEO HTTP API and control plane."
requires-python = ">=3.12,<3.14"
dependencies = [
  "aeo-domain-contracts",
  "aeo-platform-core",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.54.0,<1",
]

[tool.uv.sources]
aeo-domain-contracts = { workspace = true }
aeo-platform-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeo_api"]
