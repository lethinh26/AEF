[project]
name = "aeo-worker"
version = "0.1.0"
description = "Durable background worker for AEO."
requires-python = ">=3.12,<3.14"
dependencies = [
  "aeo-domain-contracts",
  "aeo-platform-core",
  "structlog>=24.4,<26",
]

[tool.uv.sources]
aeo-domain-contracts = { workspace = true }
aeo-platform-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeo_worker"]
