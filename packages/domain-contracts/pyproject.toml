[project]
name = "aeo-domain-contracts"
version = "0.1.0"
description = "Versioned domain and event contracts for AEO."
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.10,<3"]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeo_contracts"]
