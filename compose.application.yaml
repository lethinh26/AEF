services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "-c", "infra/migrations/alembic.ini", "upgrade", "head"]
    environment: &app-environment
      AEO_ENVIRONMENT: ${AEO_ENVIRONMENT:-local}
      AEO_LOG_LEVEL: ${AEO_LOG_LEVEL:-INFO}
      AEO_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aeo}:${POSTGRES_PASSWORD:-aeo_local_only_change_me}@postgres:5432/${POSTGRES_DB:-aeo}
      AEO_CORS_ORIGINS: '["http://localhost:3210","http://127.0.0.1:3210"]'
      AEO_S3_ENDPOINT_URL: http://object-store:9000
      AEO_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-aeo-local}
      AEO_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-aeo_local_object_store_change_me}
      AEO_S3_BUCKET: aeo-artifacts
      AEO_GITHUB_TOKEN: ${AEO_GITHUB_TOKEN:-}
      AEO_GITHUB_REPOSITORIES: '${AEO_GITHUB_REPOSITORIES:-["lethinh26/Clucky","lethinh26/Llms-System"]}'
      AEO_GITHUB_PUBLIC_REPOSITORIES: '${AEO_GITHUB_PUBLIC_REPOSITORIES:-["lethinh26/Clucky"]}'
      AEO_GITHUB_SYNC_INTERVAL_SECONDS: ${AEO_GITHUB_SYNC_INTERVAL_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-store-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      AEO_API_INTERNAL_URL: http://api:8100
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3210:3210"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3210').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
